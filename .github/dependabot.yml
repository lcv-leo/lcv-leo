# Único ecossistema deste repositório: GitHub Actions (pages.yml, codeql.yml).
# As actions são pinadas por SHA; o Dependabot atualiza o pin e o comentário de versão.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # A política geral usa sete dias; apenas software oficial do GitHub é
    # exceção, para receber correções upstream assim que publicadas.
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"
