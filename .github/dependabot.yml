# Ecossistemas deste repositório: GitHub Actions e npm para ferramentas de teste.
# As Actions são pinadas por SHA; o Dependabot atualiza o pin e o comentário de versão.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    # A política geral usa sete dias; apenas software oficial do GitHub é
    # exceção, para receber correções upstream assim que publicadas.
    cooldown:
      default-days: 7
      exclude:
        - "actions/*"
        - "github/*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
