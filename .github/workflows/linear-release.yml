name: Linear Release

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Deploy Pages
    types:
      - completed

permissions: {}

concurrency:
  group: linear-release-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.conclusion }}
  cancel-in-progress: false

jobs:
  linear_release:
    name: Linear Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: linear-release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create Linear release
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
          CLI_URL: https://github.com/linear/linear-release/releases/download/v0.16.0/linear-release-linux-x64
          CLI_SHA256: 963ae1cb3b5302372a4d988b89bf16a91dfae51f504e9493c14a9f89441a89be
        run: |
          bin="$RUNNER_TEMP/linear-release"
          curl -fsSL "$CLI_URL" -o "$bin"
          echo "$CLI_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          "$bin" sync