# Gera a animação da cobra do grid de contribuições consumida pelo README
# do profile (branch output). Actions pinadas por SHA completo, como em
# todos os repositórios da organização.
name: Generate snake animation

on:
  schedule:
    - cron: "0 6 * * *" # diário, 03:00 em Brasília
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push do SVG gerado para o branch output
    steps:
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: lcv-leo
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push nativo (sem action de terceiro): dist/ vira o único commit do
      # branch output, forçado a cada geração — mesmo comportamento do
      # keep_history: false da action que este passo substituiu.
      - name: Push para o branch output
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy snake SVGs"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
