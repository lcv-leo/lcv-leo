# This workflow is managed by gh actions-lock.
# Gera a animação do grid e publica site/ no GitHub Pages
# (domínio custom lcv-leo.lcv.dev), sem branch de artefatos.
# Actions pinadas por SHA completo, como em todos os repositórios da organização.
name: Deploy Pages

on:
  pull_request:
    branches:
      - main
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
  schedule:
    - cron: "17 6 * * *" # diário, 03:17 em Brasília; evita o pico da hora cheia
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "README.md"
      - "THIRDPARTY.md"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "scripts/generate-contribution-snake.mjs"
      - "scripts/generate-contribution-snake.test.mjs"
      - "scripts/linear-release-trust.test.mjs"
      - "scripts/pages-provenance-contract.mjs"
      - "scripts/pages-provenance.spec.mjs"
      - "scripts/provenance-drift.test.mjs"
      - ".github/workflows/actions.lock"
      - ".github/workflows/pages.yml"
      - ".github/workflows/linear-release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-snake:
    name: Test Pages and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Check out untrusted PR content without granting write access or persisting credentials.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install official Playwright Chromium headless shell
        run: ./node_modules/.bin/playwright install --with-deps --only-shell chromium

      - name: Install official GitHub Actions lock validator
        shell: bash
        env:
          ACTIONS_LOCK_SHA256: 4181ec1da5408b34b9a542a7ee5c6ce3a4d6ac815c7d0206a00ceca8a817f4e3
          ACTIONS_LOCK_URL: https://github.com/github/gh-actions-lock/releases/download/v0.1.6/linux-amd64
        run: |
          set -euo pipefail
          readonly binary="${RUNNER_TEMP}/gh-actions-lock"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            "${ACTIONS_LOCK_URL}" \
            --output "${binary}"
          printf '%s  %s\n' "${ACTIONS_LOCK_SHA256}" "${binary}" | sha256sum --check --strict
          chmod 0500 "${binary}"
          printf '%s\n' "${RUNNER_TEMP}" >>"${GITHUB_PATH}"

      - name: Verify actions.lock with the official GitHub validator
        run: >-
          gh-actions-lock
          --verify-local
          --no-fix
          --no-migrate-local-actions

      - name: Reverify actions.lock against GitHub on a trusted ref
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh-actions-lock
          --verify
          --no-migrate-local-actions

      - name: Run local repository tests without credentials
        run: >-
          node --test
          scripts/generate-contribution-snake.test.mjs
          scripts/linear-release-trust.test.mjs

      - name: Run provenance tests without credentials
        if: github.event_name == 'pull_request'
        run: |
          node --test scripts/provenance-drift.test.mjs
          ./node_modules/.bin/playwright test

      - name: Run provenance tests on a trusted ref
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/provenance-drift.test.mjs
          ./node_modules/.bin/playwright test

  build:
    if: github.event_name != 'pull_request'
    name: Build GitHub Pages artifact
    needs: test-snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the profile and static site sources.
      pages: read # Let configure-pages read the existing Pages site metadata.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false

      - name: Generate contribution snake SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: lcv-leo
        run: node scripts/generate-contribution-snake.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Publish the validated Pages artifact.
      id-token: write # Request the OIDC token used by Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
