# This workflow is managed by gh actions-lock.
# Gera a animação do grid e publica site/ no GitHub Pages
# (domínio custom lcv-leo.lcv.dev), sem branch de artefatos.
# Actions pinadas por SHA completo, como em todos os repositórios da organização.
name: Deploy Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/generate-contribution-snake.mjs"
      - "scripts/generate-contribution-snake.test.mjs"
      - "scripts/linear-release-trust.test.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/linear-release.yml"
  schedule:
    - cron: "17 6 * * *" # diário, 03:17 em Brasília; evita o pico da hora cheia
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "README.md"
      - "scripts/generate-contribution-snake.mjs"
      - "scripts/generate-contribution-snake.test.mjs"
      - "scripts/linear-release-trust.test.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/linear-release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-snake:
    name: Test Pages and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Check out untrusted PR content without granting write access or exposing a secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run generator tests
        run: >-
          node --test
          scripts/generate-contribution-snake.test.mjs
          scripts/linear-release-trust.test.mjs

  build:
    if: github.event_name != 'pull_request'
    name: Build GitHub Pages artifact
    needs: test-snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the profile and static site sources.
      pages: read # Let configure-pages read the existing Pages site metadata.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate contribution snake SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: lcv-leo
        run: node scripts/generate-contribution-snake.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Publish the validated Pages artifact.
      id-token: write # Request the OIDC token used by Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
