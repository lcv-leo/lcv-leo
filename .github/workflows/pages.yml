# This workflow is managed by gh actions-lock.
# Gera a animação do grid e publica site/ no GitHub Pages
# (domínio custom lcv-leo.lcv.dev), sem branch de artefatos.
# Actions pinadas por SHA completo, como em todos os repositórios da organização.
name: Deploy Pages

on:
  schedule:
    - cron: "17 6 * * *" # diário, 03:17 em Brasília; evita o pico da hora cheia
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Check out the profile and static site sources.
      pages: read # Let configure-pages read the existing Pages site metadata.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate contribution snake SVGs
        uses: platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: lcv-leo
          outputs: |
            site/github-contribution-grid-snake.svg
            site/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # Publish the validated Pages artifact.
      id-token: write # Request the OIDC token used by Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
