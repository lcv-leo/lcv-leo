# This workflow is managed by gh actions-lock.
# This workflow uses only GitHub's official App-token action. It treats the
# pull-request snapshot strictly as untrusted data and executes only the
# semantic validator bundled by the pinned LCV Ideas & Software actions-lock
# policy commit.
#
# Threat boundary: this prevents untrusted pull-request content and accidental
# invalid lockfiles from approving themselves. The required status is published
# exclusively by a least-privilege GitHub App dedicated to this validator.

name: Actions lock trusted validator

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Actions lock validation trigger
    types:
      - completed

permissions: {}

concurrency:
  group: actions-lock-trusted-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Publish trusted actions.lock status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: actions-lock-validation
    permissions:
      contents: read # Resolve and download the exact pull-request snapshot.
    steps:
      - name: Create dedicated status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.ACTIONS_LOCK_VALIDATOR_CLIENT_ID }}
          private-key: ${{ secrets.ACTIONS_LOCK_VALIDATOR_PRIVATE_KEY }}
          permission-statuses: write

      - name: Validate untrusted snapshot and publish status
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STATUS_CONTEXT: Validate actions.lock
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -Eeuo pipefail

          readonly lock_version='v0.1.6'
          readonly lock_asset_url='https://github.com/github/gh-actions-lock/releases/download/v0.1.6/linux-amd64'
          readonly lock_asset_sha256='4181ec1da5408b34b9a542a7ee5c6ce3a4d6ac815c7d0206a00ceca8a817f4e3'
          readonly policy_repository='LCV-Ideas-Software/actions-lock-policy'
          readonly policy_sha='bdde91d4d2b47275e244e4a9b23cbf97269d23da'
          readonly policy_bundle='dist/verify-actions-lock.cjs'

          fail() {
            printf '%s\n' "::error::$1" >&2
            exit 1
          }

          extract_single_root() {
            local archive_path="$1"
            local destination="$2"
            local label="$3"
            local -a roots=()

            mkdir -p "${destination}"
            if ! tar \
              --extract \
              --gzip \
              --file "${archive_path}" \
              --directory "${destination}" \
              --no-same-owner \
              --no-same-permissions; then
              fail "The ${label} archive could not be extracted."
            fi

            mapfile -t roots < <(
              find "${destination}" -mindepth 1 -maxdepth 1 -print
            )
            if (( ${#roots[@]} != 1 )) || [[ ! -d "${roots[0]}" ]]; then
              fail "The ${label} archive did not contain exactly one repository root."
            fi

            printf '%s\n' "${roots[0]}"
          }

          status_started='false'

          post_status() {
            local state="$1"
            local description="$2"

            GH_TOKEN="${GH_STATUS_TOKEN}" gh api \
              --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${BASE_REPOSITORY}/statuses/${HEAD_SHA}" \
              -f "state=${state}" \
              -f "context=${STATUS_CONTEXT}" \
              -f "description=${description}" \
              -f "target_url=${STATUS_TARGET_URL}" \
              >/dev/null
          }

          finalize_status() {
            local exit_code="$?"
            trap - EXIT

            if [[ "${status_started}" == 'true' ]]; then
              if (( exit_code == 0 )); then
                if ! post_status 'success' 'actions.lock is valid and complete'; then
                  printf '%s\n' '::error::Validation passed, but the final success status could not be published.'
                  exit_code=1
                fi
              elif ! post_status 'failure' 'actions.lock validation failed'; then
                printf '%s\n' '::error::Validation failed and the final failure status could not be published.'
              fi
            fi

            exit "${exit_code}"
          }

          trap finalize_status EXIT

          if [[ "${TRIGGER_EVENT}" != 'pull_request' ]]; then
            printf '%s\n' "::error::Unexpected triggering event: ${TRIGGER_EVENT:-<empty>}"
            exit 1
          fi

          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' '::error::The triggering workflow did not provide a valid full head SHA.'
            exit 1
          fi

          if [[ ! "${HEAD_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            printf '%s\n' '::error::The triggering workflow did not provide a valid head repository name.'
            exit 1
          fi

          resolved_head_sha="$({
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${BASE_REPOSITORY}/commits/${HEAD_SHA}" \
              --jq '.sha'
          } 2>/dev/null)" || {
            printf '%s\n' '::error::The pull-request head commit does not exist in the base repository; no status was attempted.'
            exit 1
          }

          if [[ "${resolved_head_sha}" != "${HEAD_SHA}" ]]; then
            printf '%s\n' '::error::The API did not resolve the exact pull-request head SHA; no status was attempted.'
            exit 1
          fi

          post_status 'pending' 'Validating actions.lock from trusted code'
          status_started='true'

          readonly work_root="${RUNNER_TEMP}/actions-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readonly policy_archive="${work_root}/policy.tar.gz"
          readonly policy_parent="${work_root}/policy"
          readonly snapshot_archive="${work_root}/head.tar.gz"
          readonly snapshot_parent="${work_root}/snapshot"
          readonly lock_binary="${work_root}/gh-actions-lock"
          readonly lock_report="${work_root}/gh-actions-lock-report.json"

          mkdir -p "${work_root}"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${policy_repository}/tarball/${policy_sha}" \
            >"${policy_archive}"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${HEAD_REPOSITORY}/tarball/${HEAD_SHA}" \
            >"${snapshot_archive}"

          policy_root="$(
            extract_single_root "${policy_archive}" "${policy_parent}" 'trusted policy'
          )" || fail 'The trusted policy archive could not be extracted safely.'
          readonly policy_root
          readonly trusted_validator="${policy_root}/${policy_bundle}"

          snapshot_root="$(
            extract_single_root "${snapshot_archive}" "${snapshot_parent}" 'untrusted snapshot'
          )" || fail 'The untrusted snapshot archive could not be extracted safely.'
          readonly snapshot_root

          policy_symlink="$(
            find -P "${policy_root}" -type l -print -quit
          )" || fail 'The trusted policy archive could not be inspected.'
          if [[ -n "${policy_symlink}" ]]; then
            fail 'Symbolic links are not allowed in the trusted policy archive.'
          fi
          if [[ ! -f "${trusted_validator}" ]] || [[ -L "${trusted_validator}" ]]; then
            fail 'The trusted policy snapshot has no regular semantic validator bundle.'
          fi

          snapshot_symlink="$(
            find -P "${snapshot_root}" -type l -print -quit
          )"
          if [[ -n "${snapshot_symlink}" ]]; then
            printf '%s\n' '::error::Symbolic links are not allowed in the untrusted repository snapshot.'
            exit 1
          fi

          if [[ -e "${snapshot_root}/.git" || -L "${snapshot_root}/.git" ]]; then
            fail 'The untrusted snapshot unexpectedly contains a .git path.'
          fi
          mkdir --mode=0700 "${snapshot_root}/.git"

          curl \
            --fail \
            --location \
            --proto '=https' \
            --proto-redir '=https' \
            --show-error \
            --silent \
            --tlsv1.2 \
            "${lock_asset_url}" \
            --output "${lock_binary}"

          printf '%s  %s\n' "${lock_asset_sha256}" "${lock_binary}" | sha256sum --check --strict
          chmod 0500 "${lock_binary}"

          : >"${lock_report}"
          set +e
          (
            cd "${snapshot_root}" || exit 97
            "${lock_binary}" \
              --verify-local \
              --no-fix \
              --no-migrate-local-actions \
              --json=valid,findings \
              >"${lock_report}"
          )
          lock_exit_code="$?"
          readonly lock_exit_code
          set -e

          printf 'Ran github/gh-actions-lock %s against %s.\n' "${lock_version}" "${HEAD_SHA}"
          node "${trusted_validator}" \
            --repository-root "${snapshot_root}" \
            --gh-actions-lock-report "${lock_report}" \
            --gh-actions-lock-exit-code "${lock_exit_code}"
